name: Build Android APK (Java 21 - Fixed SDK Path)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Latest Engine (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Hard-Fix SDK Path (Robot Blindfold)
        run: |
          mkdir -p ~/.bubblewrap
          # Yahan hai asli jadoo - GitHub ka sahi SDK path
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json

      - name: Create Keys and Manifest
        run: |
          # Keystore generator
          keytool -genkeypair -v -keystore android.keystore -keyalg RSA -keysize 2048 \
          -validity 10000 -alias android -storepass password -keypass password \
          -dname 'CN=SR, OU=Comedy, O=Gang, L=Basti, ST=UP, C=IN'
          
          mkdir -p ./pwa-apk
          cat <<EOF > ./pwa-apk/twa-manifest.json
          {
            "packageId": "com.sr.ai.mastermind",
            "host": "sharukkhan94055-coder.github.io",
            "name": "SR AI Mastermind",
            "launcherName": "SR AI",
            "display": "standalone",
            "themeColor": "#00d4ff",
            "navigationColor": "#050a18",
            "backgroundColor": "#050a18",
            "startUrl": "/SRAI/index.html",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "signingKey": { "path": "../android.keystore", "alias": "android" },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sharukkhan94055-coder.github.io/SRAI/manifest.json",
            "fallbackType": "customtabs"
          }
          EOF

      - name: Force Build (No Questions Allowed)
        run: |
          cd ./pwa-apk
          # Robot ke muh mein password thons diya taaki wo sawal na puche
          printf 'password\npassword\n' | bubblewrap build

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-AI-Mastermind-APK
          path: ./pwa-apk/*.apk
