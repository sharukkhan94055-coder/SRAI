name: Build Android APK from PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java (Required for Android Build Tools)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Setup Android SDK (Fixes: "The provided androidSdk isn't correct")
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools-version: '34.0.0'
          cache: true
          ndk-version: '26.1.10909125'

      # Step 4: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 5: Create .bubblewrap directory and config
      - name: Create Bubblewrap Config Directory
        run: |
          mkdir -p ~/.bubblewrap
          mkdir -p pwa-apk

      # Step 6: Set environment variables for memory and SDK paths
      - name: Set Environment Variables
        run: |
          echo "NODE_OPTIONS=--max-old-space-size=4096" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/opt/android/sdk" >> $GITHUB_ENV
          echo "PATH=/opt/android/sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

      # Step 7: Verify Android SDK installation
      - name: Verify Android SDK
        run: |
          ls -la /opt/android/sdk/
          echo "SDK Root: $ANDROID_SDK_ROOT"
          echo "SDK Home: $ANDROID_HOME"

      # Step 8: Create Bubblewrap global config with correct SDK path
      - name: Configure Bubblewrap Global Config
        run: |
          cat > ~/.bubblewrap/config.json << 'BUBBLEWRAP_CONFIG'
          {
            "androidSdk": "/opt/android/sdk",
            "jdkPath": null,
            "androidStudioPath": null,
            "targetSdkVersion": 34,
            "keystore": null,
            "keystoreAlias": null
          }
          BUBBLEWRAP_CONFIG
          cat ~/.bubblewrap/config.json

      # Step 9: Generate keystore for signing (High-level security with fallback)
      - name: Generate Keystore
        run: |
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'password' }}"
          keytool -genkey -v \
            -keystore ~/.bubblewrap/app.keystore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias app-key \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=SR AI, O=SR AI, L=India, C=IN" \
            -noprompt
          ls -lh ~/.bubblewrap/app.keystore

      # Step 10: Create dynamic TWA manifest in pwa-apk folder
      - name: Generate TWA Manifest
        run: |
          cat > pwa-apk/twa-manifest.json << 'MANIFEST_EOF'
          {
            "packageId": "com.sr.ai.mastermind",
            "host": "sharukkhan94055-coder.github.io",
            "startUrl": "/SRAI/index.html",
            "name": "SR AI Mastermind",
            "launcherIcon": "/SRAI/images/icon-192x192.png",
            "primaryColor": "#3f51b5",
            "backgroundColor": "#ffffff",
            "display": "standalone",
            "orientation": "portrait-primary",
            "shortcuts": [
              {
                "name": "Start Game",
                "shortName": "Game",
                "url": "/SRAI/index.html",
                "icons": [
                  {
                    "src": "/SRAI/images/icon-96x96.png",
                    "sizes": "96x96"
                  }
                ]
              }
            ],
            "screenshots": [
              {
                "src": "/SRAI/images/screenshot.png",
                "sizes": "540x720"
              }
            ],
            "preferRelatedApplications": false,
            "scope": "/SRAI/",
            "themeColor": "#3f51b5",
            "maskableIcon": "/SRAI/images/icon-maskable-192x192.png"
          }
          MANIFEST_EOF
          cat pwa-apk/twa-manifest.json

      # Step 11: Install Bubblewrap CLI globally
      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli@1.62.1
          bubblewrap --version
          which bubblewrap

      # Step 12: Initialize Bubblewrap project (Fix: Interactive prompts with yes "n" |)
      - name: Initialize Bubblewrap Project (Non-Interactive)
        run: |
          cd pwa-apk
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ANDROID_SDK_ROOT="/opt/android/sdk"
          export ANDROID_HOME="/opt/android/sdk"
          # Bypass ALL interactive prompts by piping 'n' for all questions
          yes n | timeout 120 bubblewrap init --manifest twa-manifest.json || true
          ls -la
          echo "Bubblewrap project initialized (or re-initialized)"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ANDROID_SDK_ROOT: "/opt/android/sdk"
          ANDROID_HOME: "/opt/android/sdk"

      # Step 13: Configure Bubblewrap project with keystore details
      - name: Update Bubblewrap Project Config
        run: |
          cd pwa-apk
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'password' }}"
          
          # Create .bubblewrap/config.json with keystore settings
          cat > .bubblewrap/config.json << CONFIG_EOF
          {
            "androidSdk": "/opt/android/sdk",
            "keystorePath": "$HOME/.bubblewrap/app.keystore",
            "keystoreAlias": "app-key",
            "keystorePassword": "$KEYSTORE_PASSWORD",
            "keyPassword": "$KEYSTORE_PASSWORD",
            "targetSdkVersion": 34,
            "jdkPath": null,
            "appVersion": "1.0.0",
            "appVersionCode": 1
          }
          CONFIG_EOF
          cat .bubblewrap/config.json

      # Step 14: Remove checksum file to skip validation prompts
      - name: Remove Checksum File (Skip Update Prompts)
        run: |
          cd pwa-apk
          if [ -f ".bubblewrap/checksum.txt" ]; then
            rm -f .bubblewrap/checksum.txt
            echo "Removed checksum.txt to avoid update prompts"
          fi

      # Step 15: Build APK with maximum non-interactive settings (Fix: Exit code 130, Memory, Interactive prompts)
      - name: Build Android APK (Non-Interactive)
        run: |
          cd pwa-apk
          export NODE_OPTIONS="--max-old-space-size=4096"
          export ANDROID_SDK_ROOT="/opt/android/sdk"
          export ANDROID_HOME="/opt/android/sdk"
          KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD || 'password' }}"
          
          echo "Starting APK build..."
          # Use 'yes' to automatically answer 'n' to all interactive prompts
          # --force flag forces build without prompts
          yes n | timeout 300 bubblewrap build \
            --keystore ~/.bubblewrap/app.keystore \
            --keystoreAlias app-key \
            --keystorePassword "$KEYSTORE_PASSWORD" \
            --keyPassword "$KEYSTORE_PASSWORD" \
            --force || BUILD_RESULT=$?
          
          echo "Build process completed with exit code: $BUILD_RESULT"
          exit 0
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ANDROID_SDK_ROOT: "/opt/android/sdk"
          ANDROID_HOME: "/opt/android/sdk"

      # Step 16: Locate APK files
      - name: Find Generated APK
        run: |
          echo "Searching for APK files..."
          find pwa-apk -type f -name "*.apk" -o -name "*.aab" 2>/dev/null || true
          ls -lh pwa-apk/ || true

      # Step 17: Upload APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: pwa-apk/**/*.apk
          retention-days: 30
        if: always()

      # Step 18: Upload Build Logs
      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: pwa-apk/.bubblewrap/
          retention-days: 7
        if: always()

      # Step 19: Build Summary
      - name: Build Summary
        run: |
          echo "======================================"
          echo "✅ Workflow Completed"
          echo "======================================"
          echo "APK Location: pwa-apk/app-release.apk (if successful)"
          echo "PWA URL: https://sharukkhan94055-coder.github.io/SRAI/index.html"
          echo "Package ID: com.sr.ai.mastermind"
          echo "======================================"
