name: Build Android APK (Force Mode Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up High-Power Engine (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK (Captain's Fix)
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          build-tools: '34.0.0'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Captain's Memory Boost + Path Config
        run: |
          # 🚀 Node.js ko 4GB memory di
          export NODE_OPTIONS="--max-old-space-size=4096"
          # 📍 Robot ko rasta dikha diya
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          echo "Memory boosted and Path locked! ✅"

      - name: Create Master Keys and Manifest
        run: |
          # 1. Digital Signature taiyar (Password: password)
          keytool -genkeypair -v -keystore android.keystore -keyalg RSA -keysize 2048 \
          -validity 10000 -alias android -storepass password -keypass password \
          -dname 'CN=SR, OU=Comedy, O=Gang, L=Basti, ST=UP, C=IN'
          
          mkdir -p ./pwa-apk
          # 2. Manifest with Passwords (Captain's Hidden Trick)
          cat <<EOF > ./pwa-apk/twa-manifest.json
          {
            "packageId": "com.sr.ai.mastermind",
            "host": "sharukkhan94055-coder.github.io",
            "name": "SR AI Mastermind",
            "launcherName": "SR AI",
            "display": "standalone",
            "themeColor": "#00d4ff",
            "navigationColor": "#050a18",
            "backgroundColor": "#050a18",
            "startUrl": "/SRAI/index.html",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "signingKey": { 
              "path": "../android.keystore", 
              "alias": "android",
              "keyPassword": "password",
              "keystorePassword": "password"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sharukkhan94055-coder.github.io/SRAI/manifest.json",
            "fallbackType": "customtabs"
          }
          EOF

      - name: Final Build (Captain's Force Mode)
        run: |
          cd ./pwa-apk
          # Memory boost build ke waqt bhi
          export NODE_OPTIONS="--max-old-space-size=4096"
          # Captain's Trick: --force se koi sawal nahi pucha jayega
          # --skipSigning isliye taaki keystore par na atke
          bubblewrap build --skipSigning --force

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-AI-Mastermind-APK
          path: ./pwa-apk/*.apk
