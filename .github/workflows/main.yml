name: Build Android APK (SR-AI Force Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Latest Engine (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Bypass Questions (Create Manual Config)
        run: |
          # Robot ko rasta dikha diya taaki wo sawal na puche
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_SDK_ROOT}\"}" > ~/.bubblewrap/config.json
          
          # Digital Signature (Keystore) banana
          keytool -genkeypair -v -keystore android.keystore -keyalg RSA -keysize 2048 \
          -validity 10000 -alias android -storepass password -keypass password \
          -dname 'CN=SR, OU=Comedy, O=Gang, L=Basti, ST=UP, C=IN'

      - name: Inject App Details (Manifest Fix)
        run: |
          mkdir -p ./pwa-apk
          # Saare 1/5, 2/5 wale sawalon ke jawab yahan hain!
          cat <<EOF > ./pwa-apk/twa-manifest.json
          {
            "packageId": "com.sr.ai.mastermind",
            "host": "sharukkhan94055-coder.github.io",
            "name": "SR AI Mastermind",
            "launcherName": "SR AI",
            "display": "standalone",
            "themeColor": "#00d4ff",
            "navigationColor": "#050a18",
            "backgroundColor": "#050a18",
            "enableNotifications": false,
            "startUrl": "/SRAI/index.html",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sharukkhan94055-coder.github.io/SRAI/manifest.json",
            "fallbackType": "customtabs",
            "isHarman": false
          }
          EOF

      - name: Final Build (No Questions Asked)
        run: |
          cd ./pwa-apk
          # Robot ke muh mein password thons diya, ab ye nahi rukega!
          printf 'password\npassword\n' | bubblewrap build

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-AI-Mastermind-APK
          path: ./pwa-apk/*.apk
