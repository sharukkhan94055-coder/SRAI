name: Build Android APK (SR-AI Mastermind Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up High-Power Engine (Java 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK (Captain's Fix)
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          build-tools: '34.0.0'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Keys and Manifest (The Manual Masterpiece)
        run: |
          mkdir -p ./pwa-apk
          
          # Digital Signature taiyar (No questions)
          keytool -genkeypair -v -keystore ./pwa-apk/android.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias android -storepass password -keypass password \
            -dname 'CN=SR, OU=Comedy, O=Gang, L=Basti, ST=UP, C=IN' \
            -noprompt
          
          # Manifest with Passwords Included
          cat <<EOF > ./pwa-apk/twa-manifest.json
          {
            "packageId": "com.sr.ai.mastermind",
            "host": "sharukkhan94055-coder.github.io",
            "name": "SR AI Mastermind",
            "launcherName": "SR AI",
            "display": "standalone",
            "themeColor": "#00d4ff",
            "navigationColor": "#050a18",
            "backgroundColor": "#050a18",
            "startUrl": "/SRAI/index.html",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "signingKey": {
              "path": "android.keystore",
              "alias": "android",
              "keyPassword": "password",
              "keystorePassword": "password"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sharukkhan94055-coder.github.io/SRAI/manifest.json",
            "fallbackType": "customtabs"
          }
          EOF
          
      - name: Final Build (No-Init Technique)
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          # Robot config lock
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          cd ./pwa-apk
          # Seedha build, koi init nahi, koi sawal nahi!
          bubblewrap build --force --skipSigning

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-AI-Mastermind-APK
          path: ./pwa-apk/*.apk
