name: Build Android APK (Final Mastermind Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Smart Engine (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Create Dummy Keystore (Important Step!)
        run: |
          # Isse robot password nahi puchega, hum pehle hi key bana rahe hain
          keytool -genkey -v -keystore ./android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=SR, OU=Comedy, O=Gang, L=Basti, S=UP, C=IN"

      - name: Force Create Valid Manifest
        run: |
          mkdir -p ./pwa-apk
          cat <<EOF > ./pwa-apk/twa-manifest.json
          {
            "packageId": "com.srai.app",
            "host": "sharukkhan94055-coder.github.io",
            "name": "SR AI Mastermind",
            "launcherName": "SR AI",
            "display": "standalone",
            "themeColor": "#00d4ff",
            "navigationColor": "#050a18",
            "backgroundColor": "#050a18",
            "enableNotifications": false,
            "startUrl": "/SRAI/index.html",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "../android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sharukkhan94055-coder.github.io/SRAI/manifest.json",
            "fallbackType": "customtabs",
            "isHarman": false
          }
          EOF

      - name: Build APK (Automatic Response)
        run: |
          cd ./pwa-apk
          # Is baar hum password bhi saath bhej rahe hain taaki hang na ho
          printf 'password\npassword\n' | bubblewrap build

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-AI-Mastermind-APK
          path: ./pwa-apk/*.apk
