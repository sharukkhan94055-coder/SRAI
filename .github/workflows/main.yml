name: Build Android APK (100% Guaranteed Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Modern JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Bypass Internet (Start Local Server)
        run: |
          # Isse robot ko internet par nahi jana padega!
          python3 -m http.server 8000 & 
          sleep 5 # Server shuru hone ka intezaar

      - name: Generate Android APK
        run: |
          mkdir -p ./pwa-apk
          # Robot ko ab local server se file milegi, koi 404 error nahi!
          yes | bubblewrap init --manifest=http://localhost:8000/manifest.json --directory=./pwa-apk
          cd ./pwa-apk
          yes | bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SR-AI-Mastermind-APK
          path: ./pwa-apk/app-release-unsigned.apk
